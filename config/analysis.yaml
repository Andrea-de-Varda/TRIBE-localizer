# Single source of truth for all analysis parameters. Every decision here is logged in README.md.

source:
  repo: https://github.com/Pengrui-Han/LLM_Modularity.git
  commit: e3ac7fbb3a6caea05c88343a8de6ec04a4035db8
  local_dir: data/external/LLM_Modularity
  domains: [Lan, MD, phys, ToM]

stimuli:
  output: data/stimuli/stimuli.csv.gz
  word_seconds: 0.5        # one whitespace word every 0.5 s
  onset_seconds: 10.0      # stimulus onset within each isolated timeline
  timeline_seconds: 100.0  # TRIBE cuts one 100-TR segment per timeline (checkpoint duration_trs = 100, TR = 1 s)
  half_seed: 20260930      # item halves (column `half`); used only by the abandoned multivariate analysis

windows:                   # seconds; TRIBE output already includes its 5 s haemodynamic offset
  answer:    {anchor: answer_onset, start: 0.0, end: 6.0}   # saved by inference, not analysed (was for the multivariate analysis)
  full:      {anchor: stimulus,     start: 0.0, end: 0.0}   # univariate: stimulus onset -> stimulus end
  full_tail: {anchor: stimulus,     start: 0.0, end: 4.0}   # sensitivity: stimulus onset -> stimulus end + 4 s

tribe:
  checkpoint: facebook/tribev2
  tribev2_commit: af58661791a351a448a489042a28f6c37e1c14b7
  features: [text]
  batch_size: 8
  text_batch_size: 32
  shard_size: 1000         # stimuli per shard; shards contain whole items

parcels:
  networks: [LANGUAGE_noAngG, MD, TOM, PHYSICS]
  output: data/parcels/fsaverage5/parcels_fsaverage5.npz
  audit: data/parcels/fsaverage5/projection_audit.csv

paths:
  shards: results/tribe/shards           # TRIBE window means (cluster only, git-ignored)
  analysis: results/analysis             # small derived results (tracked, pushed from the cluster)

univariate:
  windows: [full, full_tail]
  n_permutations: 10000    # task-to-domain label permutations, max-statistic FWE
  seed: 20261003

parcel_summary:
  top_fraction: 0.10       # fROI = top 10% of vertices within a parcel by the independent localizer contrast
  n_permutations: 10000    # task-to-domain label permutations for the network x domain tests
  seed: 20261005
  targets:                 # the domain each parcel set is expected to prefer
    LANGUAGE_noAngG: Lan
    MD: MD
    TOM: ToM
    PHYSICS: phys

spin:
  n_rotations: 1000
  top_fraction: 0.10       # top 10% of cortical vertices of each domain map
  seed: 20261004

localizers:
  output: data/localizers/localizers.csv.gz
  shards: results/tribe/localizer_shards  # cluster only, git-ignored
  windows: [full, full_tail]               # same windows as the task maps (no answer window)
  half_seed: 20261007                      # split-half validation of each localizer
  sources:
    language:
      url: "https://www.dropbox.com/sh/c9jhmsy4l9ly2xx/AACQ41zipSZFj9mFbDfJJ9c4a?dl=1"
      sha256: c739e13f5e2768e2045a0aa9bcdd88363ab236fe9ca168ede01d86682a9a7eb3
    tom:
      url: https://saxelab.mit.edu/wp-content/uploads/2018/11/tomloc.zip
      sha256: 8c23782ec3269e22f368c9de7f426dc99bb6e551ebf6613f2eeebd877363845e
  md: {n: 100, seed: 42}                   # AlKhamissi et al. (2025) MDLocDataset
  physics: {n_towers: 60, seed: 20261006}
  contrasts:                               # network: localizer, target > control, test
    LANGUAGE_noAngG: {localizer: language, target: sentence, control: nonword, test: welch}
    MD: {localizer: md, target: hard, control: easy, test: welch}
    TOM: {localizer: tom, target: belief, control: photo, test: welch}
    PHYSICS: {localizer: physics_task, target: physics, control: colour, test: paired}
  physics_alternative: {localizer: physics_content, target: physics, control: colour, test: paired}
